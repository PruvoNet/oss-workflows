name: Workflow security

# Fails on any zizmor finding in the caller's repo (workflows, Dependabot config, ...).
# The caller's .github/zizmor.yml, if present, is honoured.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
