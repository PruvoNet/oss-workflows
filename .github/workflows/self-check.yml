name: Self check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

permissions: {}

jobs:
  actionlint:
    name: Workflow syntax (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # zizmor accepts YAML that GitHub rejects; actionlint parses workflows the way GitHub does.
      - name: actionlint
        run: pipx run --spec actionlint-py==1.7.12.25 actionlint -color .github/workflows/*.yml

  zizmor:
    permissions:
      contents: read
    uses: ./.github/workflows/zizmor.yml
