name: Self check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

permissions: {}

jobs:
  actionlint:
    name: Workflow syntax (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor accepts YAML that GitHub rejects; actionlint parses workflows the way GitHub does.
      - name: actionlint
        run: pipx run --spec actionlint-py==1.7.12.25 actionlint -color .github/workflows/*.yml

  zizmor:
    permissions:
      contents: read
    uses: ./.github/workflows/zizmor.yml
