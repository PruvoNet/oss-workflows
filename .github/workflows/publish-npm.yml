name: Publish (npm, OIDC)

# Publishes the caller's package to npmjs through npm trusted publishing: no npm token.
# npm validates the CALLING workflow's filename, so the npm trusted publisher names the caller
# (publish.yml in the package repo), not this file.
on:
  workflow_call:
    inputs:
      package-manager:
        description: yarn, npm or pnpm
        type: string
        default: yarn
      pnpm-version:
        type: string
        default: '10'
      install-command:
        description: Overrides the default frozen-lockfile install
        type: string
        default: ''
      build-command:
        type: string
        default: ''

permissions: {}

env:
  # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
  NODE_VERSION: 24.x
  REGISTRY: https://registry.npmjs.org/

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # A pre-release must never become the stable `latest` version on npm.
    if: github.event_name != 'release' || !github.event.release.prerelease
    permissions:
      id-token: write # OIDC token for npm trusted publishing
      contents: read
    env:
      PM: ${{ inputs.package-manager }}
      INSTALL_CMD: ${{ inputs.install-command }}
      BUILD_CMD: ${{ inputs.build-command }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY }}
          # No cache in the job that publishes: a poisoned cache entry would ship in the package.
          package-manager-cache: false

      - name: Install dependencies
        shell: bash
        run: |
          if [ -n "$INSTALL_CMD" ]; then bash -c "$INSTALL_CMD"; exit; fi
          case "$PM" in
            yarn) yarn install --frozen-lockfile ;;
            pnpm) pnpm install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "::error::Unknown package-manager: $PM"; exit 1 ;;
          esac

      - name: Build
        if: inputs.build-command != ''
        shell: bash
        run: bash -c "$BUILD_CMD"

      # npm never lets a published version be reused, so a tag/manifest mismatch must fail before publishing.
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Publish
        run: npm publish
